<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Luna">
<meta name="theme-color" content="#0d1220">
<link rel="apple-touch-icon" href="icon.png">
<title>La Luna AR</title>
<style>
  :root { --bg: #0d1220; --ink: #f4f1e8; --accent: #ffd34d; --ring: #6fe3ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font: 18px/1.35 ui-rounded, "SF Pro Rounded", system-ui, sans-serif; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
  #stage { position: fixed; inset: 0; }
  #start { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 40%, #1d2a4a, var(--bg)); z-index: 10; }
  #start h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: 1px; }
  #start p { margin: 0 0 28px; opacity: .85; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 14px 26px; background: var(--accent); color: #1a1400;
    font-weight: 700; box-shadow: 0 4px 0 #b8901f; }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #b8901f; }
  #hint a { pointer-events: auto; }
  #hint { pointer-events: none; position: fixed; top: 42%; left: 16px; right: 16px; text-align: center; z-index: 5;
    background: rgba(13,18,32,.72); padding: 10px 14px; border-radius: 14px; transition: opacity .4s; }
  #card { position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 5;
    background: rgba(13,18,32,.88); border: 2px solid var(--accent); border-radius: 20px; padding: 14px 18px 16px;
    transform: translateY(140%); transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
  #card.show { transform: none; }
  #card h2 { margin: 0 0 4px; font-size: 22px; color: var(--accent); }
  #card p { margin: 0; }
  #fact { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 4; }
  #card.show ~ #fact { opacity: 0; pointer-events: none; }
  .mindar-ui-overlay { display: none !important; }
  #skip { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; z-index: 6; padding: 8px 16px;
    background: rgba(13,18,32,.75); color: var(--ink); box-shadow: none; border: 1.5px solid rgba(244,241,232,.5); font-size: 15px; }
  #chips { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 6;
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  #chips button { flex: none; padding: 8px 14px; font-size: 15px; background: rgba(13,18,32,.78); color: var(--ink);
    box-shadow: none; border: 1.5px solid rgba(244,241,232,.35); display: flex; align-items: center; gap: 7px; }
  #chips i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="start">
  <div>
    <h1>🌕 La Luna</h1>
    <p>Apunta el teléfono al dibujo de la Luna<br>y toca los círculos que brillan.</p>
    <button id="go">¡Empezar!</button>
  </div>
</div>
<div id="hint" style="opacity:0">Apunta al dibujo de la Luna 🔭</div>
<div id="card"><h2 id="cname"></h2><p id="ctext"></p></div>
<button id="fact" style="display:none">¿Sabías que…?</button>
<button id="skip" style="display:none">Saltar ›</button>
<div id="chips" style="display:none">
  <button data-t="mar"><i style="background:#6fe3ff"></i>Mares</button>
  <button data-t="cráter"><i style="background:#ffd34d"></i>Cráteres</button>
  <button data-t="montañas"><i style="background:#8dff9e"></i>Montañas</button>
  <button data-t="visitado"><i style="background:#fff"></i>Visitados</button>
</div>

<script type="module">
import * as THREE from "three";

const DEMO = new URLSearchParams(location.search).has("demo");
const data = await (await fetch("features.json")).json();
const $ = id => document.getElementById(id);

// ---------- voice: pre-recorded Spanish (Paulina), browser voice only as a fallback ----------
const player = new Audio();
player.preload = "auto";
function speakFallback(text) {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^es/i.test(v.lang));
  const v = vs.find(v => /Paulina|Mónica|Monica/.test(v.name)) || vs.find(v => /es.(MX|US|419)/i.test(v.lang)) || vs[0];
  const u = new SpeechSynthesisUtterance(text);
  u.lang = v ? v.lang : "es-MX"; if (v) u.voice = v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function play(key, text) {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  player.pause();
  player.src = `audio/${key}.m4a`;
  player.currentTime = 0;
  player.play().catch(() => speakFallback(text));
}
function hush() { player.pause(); if ("speechSynthesis" in window) speechSynthesis.cancel(); }

// ---------- helpers ----------
const K = data.moon.r / 1737.4;                         // anchor units per km
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - clamp01(x), 3);
const flat = (c, o = {}) => new THREE.MeshBasicMaterial({ color: c, transparent: true, depthTest: false, side: THREE.DoubleSide, ...o });
const solid = c => new THREE.MeshStandardMaterial({ color: c, roughness: 0.7, metalness: 0.15 });
const upCone = (r, segs = 8) => { const g = new THREE.ConeGeometry(r, 1, segs); g.rotateX(Math.PI / 2); g.translate(0, 0, 0.5); return g; };
function label(text, h = 0.02) {
  const c = document.createElement("canvas"); const x = c.getContext("2d");
  x.font = "bold 64px ui-rounded, system-ui, sans-serif";
  c.width = Math.ceil(x.measureText(text).width) + 40; c.height = 96;
  x.font = "bold 64px ui-rounded, system-ui, sans-serif";
  x.fillStyle = "rgba(13,18,32,.85)"; x.beginPath(); x.roundRect(0, 0, c.width, c.height, 40); x.fill();
  x.fillStyle = "#ffd34d"; x.textBaseline = "middle"; x.fillText(text, 20, 50);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  s.scale.set(h * c.width / c.height, h, 1); s.renderOrder = 10;
  return s;
}

// ---------- the content pinned to the drawing ----------
const content = new THREE.Group();
content.add(new THREE.AmbientLight(0xffffff, 1.4));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(0.4, -0.6, 1); content.add(sun);
const TYPE_COLOR = { "mar": 0x6fe3ff, "cráter": 0xffd34d, "montañas": 0x8dff9e };
const TITLES = { "mar": "Mares", "cráter": "Cráteres", "montañas": "Montañas", "visitado": "Lugares visitados" };
const marks = [];
function ribbon(pts, w, closed) {          // a flat line of real width (WebGL lines are 1 px)
  const n = pts.length, pos = [], idx = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const [tx, ty] = !closed && i === 0 ? [b.x - p.x, b.y - p.y] : !closed && i === n - 1 ? [p.x - a.x, p.y - a.y] : [b.x - a.x, b.y - a.y];
    const L = Math.hypot(tx, ty) || 1, nx = -ty / L * w / 2, ny = tx / L * w / 2;
    pos.push(p.x + nx, p.y + ny, 0, p.x - nx, p.y - ny, 0);
  }
  for (let i = 0; i < (closed ? n : n - 1); i++) { const j = (i + 1) % n; idx.push(2 * i, 2 * i + 1, 2 * j, 2 * i + 1, 2 * j + 1, 2 * j); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); geo.setIndex(idx);
  return geo;
}
data.features.forEach((f, i) => {
  const col = TYPE_COLOR[f.type] ?? 0x6fe3ff;
  const g = new THREE.Group();
  g.position.set(f.pos[0], f.pos[1], 0.002);
  const rel = q => new THREE.Vector2(q[0] - f.pos[0], q[1] - f.pos[1]);
  let ring, glow, hits = [], outlined = true;
  if (f.outline) {                                   // seas and craters: their real outline
    const pts = f.outline.map(rel);
    ring = new THREE.Mesh(ribbon(pts, 0.0032, true), flat(col, { opacity: 0.95 }));
    glow = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts)), flat(col, { opacity: 0.1 }));
    hits.push(new THREE.Mesh(glow.geometry, new THREE.MeshBasicMaterial({ visible: false })));
    const c = pts.reduce((a, p) => a.add(p), new THREE.Vector2()).divideScalar(pts.length);
    const small = new THREE.Mesh(new THREE.CircleGeometry(0.03, 20), new THREE.MeshBasicMaterial({ visible: false }));
    small.position.set(c.x, c.y, 0);                 // tiny craters stay easy to tap
    if (Math.max(...pts.map(p => p.distanceTo(c))) < 0.03) hits.push(small);
  } else if (f.line) {                               // mountain ranges: the ridge line
    const pts = f.line.map(rel);
    ring = new THREE.Mesh(ribbon(pts, 0.006, false), flat(col, { opacity: 0.95 }));
    glow = new THREE.Mesh(ribbon(pts, 0.02, false), flat(col, { opacity: 0.12 }));
    hits.push(new THREE.Mesh(ribbon(pts, 0.05, false), new THREE.MeshBasicMaterial({ visible: false })));
  } else {
    outlined = false;
    const r = Math.max(f.r, 0.012);
    ring = new THREE.Mesh(new THREE.RingGeometry(r, r + 0.004, 48), flat(col, { opacity: 0.95 }));
    glow = new THREE.Mesh(new THREE.CircleGeometry(r + 0.012, 48), flat(col, { opacity: 0.18 }));
    hits.push(new THREE.Mesh(new THREE.CircleGeometry(Math.max(r + 0.02, 0.035), 24), new THREE.MeshBasicMaterial({ visible: false })));
  }
  if (f.visited) {                                   // where people/robots landed: a small x
    const s = 0.008, p = rel(f.pos);
    for (const a of [Math.PI / 4, -Math.PI / 4]) {
      const x = new THREE.Mesh(new THREE.PlaneGeometry(s * 2, 0.0028), flat(0xffffff, { opacity: 0.95 }));
      x.rotation.z = a; x.position.set(p.x, p.y, 0.001); g.add(x);
    }
  }
  g.add(glow, ring, ...hits);
  content.add(g);
  const m = { f, i, g, ring, glow, hits, outlined, color: col, phase: Math.random() * 6.28 };
  for (const h of hits) h.userData.mark = m;
  marks.push(m);
});

// ---------- animations: one short scene per feature ----------
const FX = {
  "MAR DE LAS LLUVIAS": f => {            // a giant rock hits, the hole fills with lava, the lava cools
    const g = new THREE.Group(), R = f.km * K;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.014), solid(0x8a7f74));
    const flash = new THREE.Mesh(new THREE.CircleGeometry(1, 48), flat(0xffffff, { opacity: 0 }));
    const shock = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64), flat(0xffe0a0, { opacity: 0 }));
    const lava = new THREE.Mesh(new THREE.CircleGeometry(1, 64), flat(0xff6a1a, { opacity: 0 }));
    g.add(lava, shock, flash, rock);
    const from = new THREE.Vector3(R * 2.4, R * 2.8, 0.4), to = new THREE.Vector3(), hot = new THREE.Color(0xff6a1a), cold = new THREE.Color(0x4a4440);
    return { g, update(t) {
      if (t < 1.2) { rock.position.lerpVectors(from, to, (t / 1.2) ** 2); rock.rotation.x += 0.2; rock.rotation.y += 0.13; } else rock.visible = false;
      const u = t - 1.2;
      if (u > 0) {
        flash.material.opacity = clamp01(1 - u / 0.5); flash.scale.setScalar(R * 0.35 * (1 + u * 3));
        shock.material.opacity = clamp01(1 - u / 1.3); shock.scale.setScalar(Math.max(1e-4, R * 1.15 * ease(u / 1.3)));
        const lf = clamp01((u - 0.8) / 2.4);
        lava.scale.setScalar(Math.max(1e-4, R * ease(lf)));
        lava.material.opacity = 0.8 * lf * clamp01((9.5 - u) / 1.5);
        lava.material.color.lerpColors(hot, cold, clamp01((u - 3.5) / 3));
      }
      return t < 11;
    } };
  },
  "OCÉANO DE LAS TORMENTAS": f => {       // hot lava spreads everywhere, then cools into dry rock
    const g = new THREE.Group(), R = Math.min(f.km * K, 0.075);
    const blobs = Array.from({ length: 9 }, (_, i) => {
      const b = new THREE.Mesh(new THREE.CircleGeometry(1, 40), flat(0xff6a1a, { opacity: 0 }));
      const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * R * 0.75;
      b.position.set(Math.cos(a) * d, Math.sin(a) * d, 0.001 + i * 0.0002);
      b.scale.set(1, 0.75 + Math.random() * 0.5, 1); b.rotation.z = Math.random() * 6.28;
      b.userData = { s: R * (0.3 + Math.random() * 0.3), d: i * 0.3 }; g.add(b); return b; });
    const cracks = Array.from({ length: 7 }, () => {
      const pts = [new THREE.Vector3((Math.random() - 0.5) * R, (Math.random() - 0.5) * R, 0.004)];
      for (let k = 0; k < 5; k++) pts.push(pts[pts.length - 1].clone().add(new THREE.Vector3((Math.random() - 0.5) * R * 0.35, (Math.random() - 0.5) * R * 0.35, 0)));
      const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x1d1a18, transparent: true, opacity: 0, depthTest: false }));
      g.add(l); return l; });
    const tag = label("lava seca", 0.022); tag.position.set(0, 0, 0.05); tag.visible = false; g.add(tag);
    const warm = new THREE.Color(0xffd060), hot = new THREE.Color(0xff5a14), cold = new THREE.Color(0x5a5550);
    return { g, update(t) {
      const fade = clamp01((11.5 - t) / 1);
      for (const b of blobs) {
        const u = t - b.userData.d, sc = Math.max(1e-4, b.userData.s * ease(u / 1.8) * (1 + 0.04 * Math.sin(t * 5 + u)));
        b.scale.x = sc; b.scale.y = sc * 0.9;
        b.material.opacity = u > 0 ? 0.82 * fade : 0;
        if (t < 4.5) b.material.color.lerpColors(warm, hot, clamp01(u / 1.2)); else b.material.color.lerpColors(hot, cold, clamp01((t - 4.5) / 2.5));
      }
      for (const c of cracks) c.material.opacity = clamp01((t - 6.5) / 1) * 0.9 * fade;
      tag.visible = t > 6.8 && t < 11;
      return t < 11.5;
    } };
  },
  "TYCHO": () => {                        // a young crater: bright rays shoot out like a sun
    const g = new THREE.Group();
    const core = new THREE.Mesh(new THREE.CircleGeometry(0.009, 32), flat(0xffffff)); core.position.z = 0.003; g.add(core);
    const rays = Array.from({ length: 16 }, (_, i) => {
      const r = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.0028).translate(0.5, 0, 0), flat(0xfff3c4, { opacity: 0.9 }));
      r.rotation.z = i / 16 * 6.28 + (Math.random() - 0.5) * 0.2; r.userData = { L: 0.07 + Math.random() * 0.16, d: Math.random() * 0.4 };
      r.position.z = 0.002; r.scale.x = 1e-4; g.add(r); return r; });
    return { g, update(t) {
      const fade = clamp01((8 - t) / 1);
      core.scale.setScalar(1 + 0.5 * Math.max(0, 1 - t * 2) + 0.1 * Math.sin(t * 6));
      for (const r of rays) { r.scale.x = Math.max(1e-4, r.userData.L * ease((t - 0.3 - r.userData.d) / 1.4)); r.material.opacity = 0.9 * fade; }
      core.material.opacity = fade;
      return t < 8;
    } };
  },
  "PLATÓN": f => {                        // lava pours in and makes a dark, flat lake
    const g = new THREE.Group(), R = Math.max(f.km * K, 0.012);
    const rim = new THREE.Mesh(new THREE.RingGeometry(R, R + 0.003, 64), flat(0xffd34d)); g.add(rim);
    const lake = new THREE.Mesh(new THREE.CircleGeometry(R, 64), flat(0xff6a1a, { opacity: 0 })); lake.position.z = 0.001; g.add(lake);
    const shine = new THREE.Mesh(new THREE.PlaneGeometry(0.004, R * 1.8), flat(0xffffff, { opacity: 0 })); shine.position.z = 0.002; g.add(shine);
    const tag = label("lago de lava", 0.018); tag.position.set(0, 0, 0.04); tag.visible = false; g.add(tag);
    const hot = new THREE.Color(0xff6a1a), dark = new THREE.Color(0x1e1b1a);
    return { g, update(t) {
      const fade = clamp01((8.5 - t) / 1);
      lake.scale.setScalar(Math.max(1e-4, ease(t / 2.2))); lake.material.opacity = 0.9 * fade;
      lake.material.color.lerpColors(hot, dark, clamp01((t - 2.5) / 2));
      const s = (t - 5) / 1.5; shine.visible = s > 0 && s < 1; shine.position.x = (s - 0.5) * R * 1.6; shine.material.opacity = 0.5 * Math.sin(clamp01(s) * Math.PI);
      rim.material.opacity = fade; tag.visible = t > 3 && t < 8;
      return t < 8.5;
    } };
  },
  "CLAVIUS": f => {                       // little crystals of frozen water sparkle out of the crater
    const g = new THREE.Group(), R = f.km * K;
    const rim = new THREE.Mesh(new THREE.RingGeometry(R, R + 0.003, 64), flat(0xbfe9ff)); g.add(rim);
    const ice = Array.from({ length: 16 }, () => {
      const c = new THREE.Mesh(new THREE.OctahedronGeometry(0.0035), new THREE.MeshStandardMaterial({ color: 0xcff2ff, emissive: 0x3a7a9a, roughness: 0.2, metalness: 0.3, transparent: true }));
      const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * R * 0.8;
      c.position.set(Math.cos(a) * d, Math.sin(a) * d, 0); c.userData = { d: Math.random() * 2, v: 0.008 + Math.random() * 0.01 }; g.add(c); return c; });
    const tag = label("¡agua congelada!", 0.018); tag.position.set(0, 0, 0.06); tag.visible = false; g.add(tag);
    return { g, update(t) {
      const fade = clamp01((9 - t) / 1);
      for (const c of ice) { const u = Math.max(0, t - c.userData.d); c.position.z = Math.min(0.045, u * c.userData.v);
        c.rotation.x = t * 2; c.rotation.y = t * 1.3; c.scale.setScalar(Math.max(1e-4, ease(u / 0.5)) * (1 + 0.3 * Math.sin(t * 9 + c.userData.d * 5))); c.material.opacity = fade; }
      rim.material.opacity = fade; tag.visible = t > 2 && t < 8.5;
      return t < 9;
    } };
  },
  "MAR DE LA SERENIDAD": () => {          // Apollo 17: the moon buggy drives around
    const g = new THREE.Group(), rover = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.014, 0.008, 0.003), solid(0xc9c2b4)); body.position.z = 0.005;
    const dish = new THREE.Mesh(new THREE.CircleGeometry(0.003, 16), solid(0xeeeeee)); dish.position.set(0.004, 0, 0.011); dish.rotation.y = 0.6;
    const mast = new THREE.Mesh(new THREE.BoxGeometry(0.0006, 0.0006, 0.005), solid(0x999999)); mast.position.set(0.004, 0, 0.008);
    rover.add(body, dish, mast);
    for (const [x, y] of [[0.006, 0.0055], [0.006, -0.0055], [-0.006, 0.0055], [-0.006, -0.0055]]) {
      const w = new THREE.Mesh(new THREE.CylinderGeometry(0.0028, 0.0028, 0.002, 14), solid(0x333333)); w.position.set(x, y, 0.003); rover.add(w); }
    g.add(rover);
    const path = t => { const a = t * 0.55; return new THREE.Vector2(Math.cos(a) * 0.035 - 0.035, Math.sin(a * 1.3) * 0.022); };
    const tracks = Array.from({ length: 40 }, () => { const d = new THREE.Mesh(new THREE.CircleGeometry(0.0012, 8), flat(0xbfe9ff, { opacity: 0 })); g.add(d); return d; });
    const tag = label("Apolo 17 · 1972", 0.016); tag.position.set(0, 0, 0.045); tag.visible = false; g.add(tag);
    let next = 0;
    return { g, update(t) {
      const fade = clamp01((10 - t) / 1), p = path(t), q = path(t + 0.05);
      rover.position.set(p.x, p.y, 0); rover.rotation.z = Math.atan2(q.y - p.y, q.x - p.x);
      if (t > next * 0.22 && next < tracks.length) { tracks[next].position.set(p.x, p.y, 0.001); tracks[next].material.opacity = 0.8; next++; }
      for (const d of tracks) if (d.material.opacity > 0) d.material.opacity = Math.min(d.material.opacity, 0.8 * fade);
      rover.visible = fade > 0.05; tag.visible = t > 0.5 && t < 9.5;
      return t < 10;
    } };
  },
  "MONTES ALPES": f => {                  // peaks rise, then a straight valley cuts through them
    const g = new THREE.Group();
    const rel = p => new THREE.Vector2(p[0] - f.pos[0], p[1] - f.pos[1]);
    const pts = f.line.map(rel), peaks = [];
    for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 3; k++) {
      const p = pts[i].clone().lerp(pts[i + 1], k / 3);
      const c = new THREE.Mesh(upCone(0.009 + Math.random() * 0.005, 7), solid(0xb9b4ad));
      c.position.set(p.x + (Math.random() - 0.5) * 0.006, p.y + (Math.random() - 0.5) * 0.006, 0);
      c.userData = { h: 0.035 + Math.random() * 0.025, d: 0.2 + peaks.length * 0.08 }; c.scale.z = 1e-4; g.add(c); peaks.push(c); }
    const [v0, v1] = f.valley.map(rel), dir = v1.clone().sub(v0), len = dir.length();
    const cut = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.006).translate(0.5, 0, 0), flat(0x6fe3ff, { opacity: 0.9 }));
    cut.position.set(v0.x, v0.y, 0.004); cut.rotation.z = Math.atan2(dir.y, dir.x); cut.scale.x = 1e-4; g.add(cut);
    const tag = label("valle recto", 0.018); tag.position.set(v1.x, v1.y, 0.05); tag.visible = false; g.add(tag);
    return { g, update(t) {
      const sink = t > 9 ? clamp01(10 - t) : 1;
      for (const c of peaks) c.scale.z = Math.max(1e-4, c.userData.h * ease((t - c.userData.d) / 0.8) * sink);
      cut.scale.x = Math.max(1e-4, len * ease((t - 2.8) / 1.2)); cut.material.opacity = 0.9 * sink;
      for (const c of peaks) { const p = new THREE.Vector2(c.position.x, c.position.y).sub(v0), along = p.dot(dir) / len, off = Math.abs(p.cross(dir) / len);
        if (t > 2.8 + 1.2 * clamp01(along / len) && off < 0.008 && along > 0 && along < len) c.scale.z = Math.max(1e-4, c.scale.z * 0.25); }
      tag.visible = t > 4 && t < 9.5;
      return t < 10;
    } };
  },
  "ARISTARCO": () => {                    // the brightest spot sparkles
    const g = new THREE.Group(), star = new THREE.Group();
    [[0.07, 0.006, 0], [0.07, 0.006, Math.PI / 2], [0.04, 0.004, Math.PI / 4], [0.04, 0.004, -Math.PI / 4]].forEach(([w, h, a]) => {
      const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), flat(0xfff6c8)); p.rotation.z = a; star.add(p); });
    star.add(new THREE.Mesh(new THREE.CircleGeometry(0.009, 24), flat(0xffffff)));
    const tw = Array.from({ length: 7 }, (_, i) => { const s = new THREE.Mesh(new THREE.CircleGeometry(0.003, 12), flat(0xffffff));
      const a = i / 7 * 6.28, d = 0.03 + Math.random() * 0.03; s.position.set(Math.cos(a) * d, Math.sin(a) * d, 0.003); s.userData.p = Math.random() * 6; g.add(s); return s; });
    star.position.z = 0.004; g.add(star);
    return { g, update(t) {
      const fade = t > 6 ? clamp01(7 - t) : 1;
      star.scale.setScalar(Math.max(1e-4, ease(t / 0.4) * (1 + 0.25 * Math.sin(t * 8)) * fade)); star.rotation.z = t * 0.7;
      for (const s of tw) s.material.opacity = fade * (0.5 + 0.5 * Math.sin(t * 6 + s.userData.p));
      return t < 7;
    } };
  },
  "COPÉRNICO": () => {                    // a whole city fits inside the crater
    const g = new THREE.Group(), R = 0.024;
    g.add(new THREE.Mesh(new THREE.RingGeometry(R, R + 0.003, 64), flat(0xffd34d)));
    const cols = [0xdfe6f0, 0xf7d9a8, 0xbfd8ff, 0xf3b6b6];
    const bs = Array.from({ length: 16 }, (_, i) => {
      const a = Math.random() * 6.28, d = Math.sqrt(Math.random()) * R * 0.72;
      const w = 0.003 + Math.random() * 0.004;
      const b = new THREE.Mesh(new THREE.BoxGeometry(w, w, 1).translate(0, 0, 0.5), solid(cols[i % 4]));
      b.position.set(Math.cos(a) * d, Math.sin(a) * d, 0); b.userData = { h: 0.006 + Math.random() * 0.02, d: 0.4 + i * 0.07 };
      b.scale.z = 1e-4; g.add(b); return b; });
    const tag = label("¡una ciudad!", 0.02); tag.position.set(0, 0, 0.05); tag.visible = false; g.add(tag);
    return { g, update(t) {
      const sink = t > 8 ? clamp01(9 - t) : 1;
      for (const b of bs) b.scale.z = Math.max(1e-4, b.userData.h * ease((t - b.userData.d) / 0.6) * sink);
      tag.visible = t > 1.8 && t < 8.5;
      return t < 9;
    } };
  },
  "MONTES APENINOS": f => {               // the mountains rise; El Ávila beside them, about half as tall
    const g = new THREE.Group();
    const pts = (f.line || [f.pos]).map(p => new THREE.Vector2(p[0] - f.pos[0], p[1] - f.pos[1]));
    const peaks = [];
    for (let i = 0; i < pts.length - 1; i++) for (let k = 0; k < 3; k++) {
      const p = pts[i].clone().lerp(pts[i + 1], k / 3);
      const c = new THREE.Mesh(upCone(0.011 + Math.random() * 0.006, 7), solid(0xb9b4ad));
      c.position.set(p.x + (Math.random() - 0.5) * 0.006, p.y + (Math.random() - 0.5) * 0.006, 0);
      c.userData = { h: 0.055 + Math.random() * 0.03, d: 0.2 + peaks.length * 0.08 }; c.scale.z = 1e-4; g.add(c); peaks.push(c);
    }
    const end = pts[pts.length - 1];
    const avila = new THREE.Mesh(upCone(0.016, 9), solid(0x3fae5a));
    avila.position.set(end.x + 0.05, end.y - 0.03, 0); avila.scale.z = 1e-4; g.add(avila);
    const tA = label("El Ávila", 0.024); tA.position.set(end.x + 0.05, end.y - 0.03, 0.06); tA.visible = false; g.add(tA);
    const tM = label("Apeninos", 0.024); tM.position.set(0, 0, 0.1); tM.visible = false; g.add(tM);
    return { g, update(t) {
      const sink = t > 9 ? clamp01(10 - t) : 1;
      for (const c of peaks) c.scale.z = Math.max(1e-4, c.userData.h * ease((t - c.userData.d) / 0.8) * sink);
      avila.scale.z = Math.max(1e-4, 0.037 * ease((t - 2.6) / 0.8) * sink);
      tM.visible = t > 1.5 && t < 9.5; tA.visible = t > 3 && t < 9.5;
      return t < 10;
    } };
  },
  "MAR DE LAS CRISIS": f => {             // a round sea, all alone at the edge: draw its outline
    const g = new THREE.Group(), R = f.km * K, n = 36;
    const dashes = Array.from({ length: n }, (_, i) => { const a = i / n * 6.28;
      const d = new THREE.Mesh(new THREE.PlaneGeometry(R * 0.11, 0.0035), flat(0x6fe3ff, { opacity: 0 }));
      d.position.set(Math.cos(a) * R, Math.sin(a) * R, 0.003); d.rotation.z = a + Math.PI / 2; g.add(d); return d; });
    const fill = new THREE.Mesh(new THREE.CircleGeometry(R, 64), flat(0x6fe3ff, { opacity: 0 })); g.add(fill);
    return { g, update(t) {
      const fade = t > 7 ? clamp01(8 - t) : 1;
      dashes.forEach((d, i) => d.material.opacity = (t * 18 > i ? 1 : 0) * fade);
      fill.material.opacity = (t > 2 ? 0.12 + 0.08 * Math.sin(t * 3) : 0) * fade;
      g.rotation.z = t * 0.15;
      return t < 8;
    } };
  },
  "MAR DE LA TRANQUILIDAD": () => {       // Apollo 11 lands, footprints, a flag
    const g = new THREE.Group(), lander = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.016, 0.016, 0.01), solid(0xd9a441)); body.position.z = 0.012;
    const cab = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.009, 0.009, 6).rotateX(Math.PI / 2), solid(0xdadada)); cab.position.z = 0.022;
    lander.add(body, cab);
    for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.0012, 0.0012, 0.015), solid(0xbbbbbb));
      leg.position.set(sx * 0.0105, sy * 0.0105, 0.0065); leg.rotation.set(sy * 0.35, -sx * 0.35, 0); lander.add(leg);
    }
    const flame = new THREE.Mesh(upCone(0.005, 12).rotateX(Math.PI), flat(0xff9a3c, { opacity: 0.9, depthTest: true }));
    flame.position.z = 0.007; lander.add(flame);
    g.add(lander);
    const dust = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 48), flat(0xdddddd, { opacity: 0 })); g.add(dust);
    const steps = Array.from({ length: 12 }, (_, i) => {
      const s = new THREE.Mesh(new THREE.CircleGeometry(1, 16), flat(0xbfe9ff, { opacity: 0 }));
      const a = 0.3 + i * 0.12, d = 0.02 + i * 0.0045, side = i % 2 ? 1 : -1;
      s.position.set(Math.cos(a) * d - Math.sin(a) * side * 0.002, Math.sin(a) * d + Math.cos(a) * side * 0.002, 0.002);
      s.scale.set(0.0016, 0.0028, 1); s.rotation.z = a - Math.PI / 2; g.add(s); return s; });
    const flag = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.0006, 0.0006, 0.024).rotateX(Math.PI / 2).translate(0, 0, 0.012), solid(0xeeeeee));
    const cloth = new THREE.Mesh(new THREE.PlaneGeometry(0.013, 0.008), new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
    cloth.rotation.x = Math.PI / 2; cloth.position.set(0.0065, 0, 0.02);
    flag.add(pole, cloth); flag.position.set(0.05, 0.048, 0); flag.scale.setScalar(1e-4); g.add(flag);
    const tag = label("1969", 0.016); tag.position.set(0, 0, 0.055); tag.visible = false; g.add(tag);
    return { g, update(t) {
      lander.position.z = 0.28 * (1 - ease(t / 2.6));
      flame.visible = t < 2.7; flame.scale.set(1, 1, 0.014 + 0.004 * Math.sin(t * 40));
      const u = t - 2.6; dust.material.opacity = u > 0 ? clamp01(1 - u) * 0.7 : 0; dust.scale.setScalar(Math.max(1e-4, 0.01 + 0.035 * clamp01(u)));
      steps.forEach((s, i) => s.material.opacity = t > 4 + i * 0.35 ? 0.9 : 0);
      flag.scale.setScalar(Math.max(1e-4, ease((t - 8.6) / 0.5)));
      tag.visible = t > 3;
      return t < 14;
    } };
  },
  "MAR DE LA FECUNDIDAD": () => {         // Luna 16 lands, scoops soil, flies it home
    const g = new THREE.Group(), probe = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.012, 0.008, 8).rotateX(Math.PI / 2), solid(0xc8c8c8)); base.position.z = 0.008;
    const pod = new THREE.Mesh(new THREE.SphereGeometry(0.006, 16, 12), solid(0xe8e0c8)); pod.position.z = 0.017;
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.0012, 0.0012).translate(0.009, 0, 0), solid(0x999999)); arm.position.z = 0.012;
    const soil = new THREE.Mesh(new THREE.SphereGeometry(0.0025, 10, 8), solid(0x6b5440)); soil.position.set(0.018, 0, 0); soil.visible = false; arm.add(soil);
    const flame = new THREE.Mesh(upCone(0.004, 12).rotateX(Math.PI), flat(0xff9a3c, { opacity: 0.9, depthTest: true }));
    flame.scale.z = 0.012;
    probe.add(base, arm, pod, flame); g.add(probe);
    const tag = label("robot Luna 16", 0.016); tag.position.set(0, 0, 0.05); tag.visible = false; g.add(tag);
    return { g, update(t) {
      probe.position.z = 0.25 * (1 - ease(t / 2.4));
      flame.position.z = probe.position.z > 0.001 ? 0.004 : 0.012; flame.visible = t < 2.5 || t > 6.2;
      arm.rotation.y = t > 3 && t < 6 ? -0.9 * Math.sin((t - 3) / 3 * Math.PI) : 0;
      soil.visible = t > 4.4 && t < 6.2;
      flame.scale.z = 0.012 + 0.004 * Math.sin(t * 40);
      if (t > 6.2) { const u = t - 6.2; pod.position.z = 0.017 + 0.35 * u * u; flame.position.z = pod.position.z - 0.005; }
      tag.visible = t > 2.4 && t < 9;
      return t < 9;
    } };
  },
};

let active = null, clockNow = 0;
function stopAnim() {
  if (!active) return;
  content.remove(active.g);
  active.g.traverse(o => { o.geometry?.dispose(); if (o.material) { o.material.map?.dispose(); o.material.dispose(); } });
  active = null;
}
function startAnim(m) {
  stopAnim();
  const make = FX[m.f.name]; if (!make) return;
  active = make(m.f);
  active.g.position.set(m.f.pos[0], m.f.pos[1], 0.003);
  active.t0 = clockNow;
  content.add(active.g);
}

let selected = null;
function select(m) {
  if (introOn) endIntro();
  focusType = null;
  selected = m;
  for (const k of marks) {
    const on = k === m;
    k.ring.material.color.set(on ? 0xffffff : k.color);
    k.glow.material.color.set(on ? 0xffffff : k.color);
  }
  $("cname").textContent = m.f.name;
  $("ctext").textContent = m.f.text;
  $("card").classList.add("show");
  play("f" + m.i, m.f.name + ". " + m.f.say);
  startAnim(m);
}
let factIdx = 0;
$("fact").addEventListener("click", () => {
  const i = factIdx++ % data.facts.length, t = data.facts[i];
  $("cname").textContent = "¿Sabías que…?";
  $("ctext").textContent = t;
  $("card").classList.add("show");
  play("fact" + i, t);
});
$("card").addEventListener("click", () => { $("card").classList.remove("show"); selected = null; hush(); stopAnim(); });

// ---------- guided intro: the kinds of places, then free exploring ----------
let focusType = null, focusTimer = 0, introOn = false, introDone = false;
const inFocus = m => focusType === "visitado" ? !!m.f.visited : m.f.type === focusType;
const wait = ms => new Promise(r => setTimeout(r, ms));
function playAndWait(key, text) {
  return new Promise(res => { let done = false; const fin = () => { if (!done) { done = true; res(); } };
    player.onended = fin; play(key, text); setTimeout(fin, 15000); });
}
async function runIntro() {
  if (introOn || introDone) return;
  introOn = true; $("skip").style.display = ""; $("chips").style.display = "none"; $("fact").style.display = "none";
  for (let i = 0; i < data.intro.length; i++) {
    const [type, text] = data.intro[i];
    focusType = type || null;
    $("cname").textContent = i === 0 ? "La Luna" : (TITLES[type] || "¡A explorar!");
    $("ctext").textContent = text;
    $("card").classList.add("show");
    await Promise.all([playAndWait("intro" + i, text), wait(2600)]);
    if (!introOn) return;
  }
  endIntro();
}
function endIntro() {
  introOn = false; introDone = true; focusType = null; player.onended = null;
  $("skip").style.display = "none"; $("chips").style.display = ""; $("fact").style.display = "";
  $("card").classList.remove("show");
}
$("skip").addEventListener("click", () => { hush(); endIntro(); });
for (const b of document.querySelectorAll("#chips button")) b.addEventListener("click", () => {
  const t = b.dataset.t, i = data.intro.findIndex(x => x[0] === t);
  selected = null; stopAnim(); focusType = t; clearTimeout(focusTimer);
  focusTimer = setTimeout(() => { focusType = null; }, 6000);
  $("cname").textContent = TITLES[t]; $("ctext").textContent = data.intro[i][1]; $("card").classList.add("show");
  play("intro" + i, data.intro[i][1]);
});

// ---------- renderer: real AR, or a demo with the drawing on screen ----------
let renderer, scene, camera, startAR;
if (DEMO) {
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  $("stage").appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0d1220);
  camera = new THREE.PerspectiveCamera(40, 1, 0.01, 10);
  const tex = new THREE.TextureLoader().load("target.png");
  tex.colorSpace = THREE.SRGBColorSpace;
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(1, data.aspect), new THREE.MeshBasicMaterial({ map: tex }));
  scene.add(paper, content);
  const fit = () => {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h); camera.aspect = w / h;
    // landscape: show the whole sheet; upright phone: zoom in on the moon
    const portrait = camera.aspect < 1;
    const span = portrait ? data.moon.r * 2.5 : 1.05;
    const need = Math.max(portrait ? span : data.aspect * 1.05, span / camera.aspect);
    const d = need / 2 / Math.tan(THREE.MathUtils.degToRad(20));
    const c = portrait ? data.moon.pos : [0, 0];
    camera.position.set(c[0], c[1] - d * 0.55, d * 0.85);     // tilted, as if holding the phone over the sheet
    camera.lookAt(c[0], c[1], 0);
    camera.updateProjectionMatrix();
  };
  addEventListener("resize", fit); fit();
  startAR = async () => {};
} else {
  const { MindARThree } = await import("mindar-image-three");
  const mind = new MindARThree({ container: $("stage"), imageTargetSrc: "target.mind",
    uiLoading: "no", uiScanning: "no", uiError: "yes", filterMinCF: 0.0001, filterBeta: 0.001 });
  ({ renderer, scene, camera } = mind);
  const anchor = mind.addAnchor(0);
  anchor.group.add(content);
  anchor.onTargetFound = () => { $("hint").style.opacity = 0; runIntro(); };
  anchor.onTargetLost = () => { $("hint").style.opacity = 1; };
  startAR = async () => { await mind.start(); $("hint").style.opacity = 1; };
}

// ---------- taps (click, so iPhone lets the tap start sound) ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
renderer.domElement.style.touchAction = "none";
$("stage").addEventListener("click", e => {
  const rect = renderer.domElement.getBoundingClientRect();
  ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(marks.flatMap(m => m.hits), false);
  // smallest target wins, so a crater inside a sea is still tappable
  const best = hits.map(h => h.object.userData.mark).sort((a, b) => (a.f.km || 0) - (b.f.km || 0))[0];
  if (best) select(best);
});

// ---------- loop ----------
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clockNow = clock.getElapsedTime();
  for (const m of marks) {
    const hl = focusType !== null && inFocus(m);
    const s = m === selected ? 1.35 + 0.08 * Math.sin(t * 6) : hl ? 1.6 + 0.15 * Math.sin(t * 5) : 1 + 0.12 * Math.sin(t * 2.2 + m.phase);
    m.g.scale.setScalar(m.outlined ? (m === selected || hl ? 1 : 1) : s);
    const dim = focusType !== null ? (hl ? 1 : 0.12) : (active && m !== selected ? 0.4 : 1);
    m.ring.material.opacity = 0.95 * dim;
    const k = m.outlined ? 0.6 : 1;
    m.glow.material.opacity = k * (m === selected ? 0.45 : hl ? 0.5 + 0.1 * Math.sin(t * 5) : 0.08 + 0.06 * Math.sin(t * 2.2 + m.phase)) * dim;
  }
  if (active && active.update(t - active.t0) === false) stopAnim();
  renderer.render(scene, camera);
});

$("go").addEventListener("click", async () => {
  play("hola", "¡Hola! Apunta el teléfono al dibujo de la Luna.");   // first sound inside a tap unlocks audio on iPhone
  $("start").remove();
  if (DEMO) setTimeout(runIntro, 1200);
  try { await startAR(); }
  catch (err) {
    $("hint").innerHTML = "No pude abrir la cámara 📷. En el iPhone: Ajustes › Safari › Cámara › Permitir. O prueba el " +
      '<a href="?demo" style="color:var(--accent)">modo sin cámara</a>.';
    $("hint").style.opacity = 1;
    console.warn("camera:", err);
  }
});
window.__moon = { marks, select, data };
</script>
</body>
